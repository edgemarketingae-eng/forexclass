name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Publish APK to the site's download folder
        run: |
          mkdir -p download
          cp android/app/build/outputs/apk/release/app-release.apk download/edge-academy.apk
          ls -la download
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add download/edge-academy.apk
          git commit -m "Build Edge Academy Android app (${GITHUB_SHA::7})" || echo "No change"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: edge-academy-apk
          path: android/app/build/outputs/apk/release/app-release.apk
