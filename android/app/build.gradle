plugins {
    id 'com.android.application'
}

android {
    namespace 'ae.edgeacademy.learn'
    compileSdk 34

    defaultConfig {
        applicationId 'ae.edgeacademy.learn'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the build machine's debug key so it installs directly (sideloading).
            // For Google Play, replace this with a private release keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
